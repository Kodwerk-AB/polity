# Weekly rebuild, plus on demand.
#
# The cadence is set by how fast the world changes: there is an election
# somewhere most weeks, and a composition that moved is picked up on the next
# run rather than being watched for continuously.
#
# The steady state is cheap by design. Each composition is keyed by a hash of
# its SOURCE FIELD, not the page revision — measured across six busy articles
# and 120 revisions, the composition field never changed once while 18 of 20
# pages were edited within 90 days. So an ordinary week costs a handful of
# model calls rather than 273, and the cache is what carries that between runs.
name: Rebuild

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# The commit this job makes is the whole product, so it needs write access and
# nothing else.
permissions:
  contents: write

concurrency:
  group: rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Keyed by run so it always restores from the most recent, and saves even
      # when the build fails — a partial harvest is still worth keeping.
      - name: Restore harvest cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: polity-cache-${{ github.run_id }}
          restore-keys: polity-cache-

      - name: Rebuild
        env:
          CLAUDE_KEY: ${{ secrets.CLAUDE_KEY }}
        run: bun run build

      - name: Regenerate schema
        run: bun run build:schema

      # Gates — nothing commits unless the refreshed data still holds up.
      #
      # `validate` is the one that catches a generator writing a field the
      # schema never described: the schema seals every object with
      # `additionalProperties: false`, and a rebuild that quietly starts
      # emitting something new fails here rather than shipping it.
      - name: Verify
        run: |
          bun run typecheck
          bun run test
          bun run validate

      # A rebuild that found nothing new should not manufacture a commit.
      #
      # The harvest takes the better part of an hour, so `main` has usually
      # moved by the time there is anything to push — a plain push is rejected
      # as stale through no fault of the data. This commit only ever touches
      # `data` and `schema`, which nothing else writes, so replaying it onto
      # the fresh tip is the correct resolution rather than a merge.
      - name: Commit
        run: |
          git config user.name  'polity'
          git config user.email 'polity@users.noreply.github.com'
          git add data schema
          if git diff --cached --quiet; then
            echo 'no change'
            exit 0
          fi
          COUNTRIES=$(node -e "console.log(Object.keys(require('./data/polity.json').countries).length)")
          ERRORS=$(node -e "console.log(require('./data/issues.json').filter(i=>i.severity==='error').length)")
          git commit -m "Rebuild: ${COUNTRIES} countries, ${ERRORS} errors"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt ${attempt}); rebasing onto the current tip"
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          git push
